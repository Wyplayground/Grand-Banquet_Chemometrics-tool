name: Test Harness plugin
on:
  push:
    paths:
      - 'dsh-gb/**'
      - '.github/workflows/dsh-gb.yml'
  pull_request:
    paths:
      - 'dsh-gb/**'
      - '.github/workflows/dsh-gb.yml'
jobs:
  integration:
    defaults:
      run:
        working-directory: dsh-gb
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dsh-gb/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: dsh-gb/requirements.lock
      - run: npm ci --ignore-scripts
      - run: python scripts/setup_gb.py
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: python -m pip check
      - run: python python/dependency_policy.py
      - run: python scripts/install.py --workspace .test-output/install-smoke --install-deps --json-progress
      - run: python scripts/install.py --workspace .test-output/install-smoke --check
      - run: npm run build:client
      - run: git diff --exit-code -- client.js
      - run: npm test
      - run: python -m unittest discover -s tests -p test_*.py -v
      - run: npm pack --ignore-scripts
